<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journeyscape | Museums</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/museum.css" />

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<a href="index.html#museum" class="back-btn">
  <i class="fa-solid fa-arrow-left"></i> BACK
</a>

<section class="museum-page">

  <div class="museum-hero">
    <p class="museum-kicker">MUSEUMS & CULTURE</p>
    <h1>Amsterdam Museums</h1>
    <p>
      Browse cultural spots, filter by mood, and discover museums that match your journey.
    </p>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="art">Art</button>
    <button class="filter-btn" data-filter="history">History</button>
    <button class="filter-btn" data-filter="modern">Modern</button>
    <button class="filter-btn" data-filter="family">Family Friendly</button>
  </div>

  <div class="museum-row" id="museumRow"></div>

</section>

<script src="js/museum-data.js"></script>
<script src="js/museum.js"></script>

</body>
</html>
